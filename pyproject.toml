[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-notes"
version = "0.2.3"
description = "本地录播 → 课件截图 + 图文笔记 + docx，外加一个可双击回看的单文件 HTML"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["lecture", "notes", "ffmpeg", "markdown", "docx", "offline"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Markup :: Markdown",
]
# 基础依赖：只要这四样就能跑到「截图 + 逐字稿 + 回看.html + docx」
dependencies = [
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "python-docx>=1.1.0",
    "requests>=2.31.0",
]

# 可选依赖：不装也必须能跑通（缺了只是降级 + 明确提示，不会崩）
[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]                 # 没有逐字稿时自动转写
ocr = ["rapidocr-onnxruntime>=1.3"]           # 课件截图里的字可搜
all = ["faster-whisper>=1.0", "rapidocr-onnxruntime>=1.3"]

[project.scripts]
lecture-notes = "lecture_notes:main"

[tool.setuptools]
py-modules = ["lecture_notes", "local_source", "md2docx", "asr", "ocr", "make_demo"]
